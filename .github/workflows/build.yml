name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create asma_app --project-name asma_ul_husna --platforms=android
          cp pubspec.yaml asma_app/pubspec.yaml
          cp lib/main.dart asma_app/lib/main.dart
          cd asma_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: asma_app/build/app/outputs/flutter-apk/app-release.apk
